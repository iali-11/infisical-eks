name: Build and Push to ECR

on:
    push:
        branches: [main]
        paths:
          - "app/**"
          - ".github/workflows/docker-build-push.yaml"
    workflow_dispatch:

permissions:
    id-token: write
    contents: write

env:
    ECR_REPOSITORY: infisical
    AWS_REGION: eu-west-2
    IMAGE_TAG: ${{ github.sha }}

concurrency:
    group: build-and-push
    cancel-in-progress: true

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        defaults:
            run:
                shell: bash
                working-directory: ./app

        steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Configure AWS Credentials
          uses: aws-actions/configure-aws-credentials@v6
          with:
            role-to-assume: ${{ secrets.OIDC_ACTIONS_ROLE }}
            aws-region: ${{ env.AWS_REGION }}

        - name: Login to Amazon ECR
          uses: aws-actions/amazon-ecr-login@v2
          id: login-ecr

        - name: Setup Docker Buildx
          uses: docker/setup-buildx-action@v4

        - name: Build Image
          uses: docker/build-push-action@v7
          with:
            context: app
            file: app/Dockerfile
            load: true
            push: false
            platforms: linux/amd64
            tags: ${{ steps.login-ecr.outputs.registry }}/infisical:${{ env.IMAGE_TAG }}

        - name: Run Trivy Scan
          uses: aquasecurity/trivy-action@v0.36.0
          with:
            image-ref: ${{ steps.login-ecr.outputs.registry }}/infisical:${{ env.IMAGE_TAG }}
            format: table
            severity: CRITICAL,HIGH
            exit-code: "0"

        - name: Push to ECR
          uses: docker/build-push-action@v7
          with:
            context: app
            file: app/Dockerfile
            platforms: linux/amd64
            push: true
            tags: ${{ steps.login-ecr.outputs.registry }}/infisical:${{ env.IMAGE_TAG }}

        - name: Update Image tag in Kubernetes Manifest
          working-directory: .
          run: |
            yq -i '.images[0].newTag = strenv(IMAGE_TAG)' kubernetes/kustomization.yaml

        - name: Commit add Push new Image Tag
          working-directory: .
          run: |
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add kubernetes/kustomization.yaml
            git diff --cached --quiet && exit 0
            git commit -m "chore: update infisical image to ${IMAGE_TAG} [skip ci]"
            git pull --rebase origin main
            git push origin main
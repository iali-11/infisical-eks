apiVersion: apps/v1
kind: Deployment
metadata:
  name: infisical-deployment
  labels:
    app: infisical
  annotations:
    reloader.stakater.com/auto: "true"

spec:
  replicas: 2
  selector:
    matchLabels:
      app: infisical

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

  template:
    metadata:
      labels:
        app: infisical

    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - infisical
              topologyKey: kubernetes.io/hostname

      containers:
      - name: infisical
        image: 050288151438.dkr.ecr.eu-west-2.amazonaws.com/infisical:3a35b1f7
        imagePullPolicy: Always
        ports:
        - containerPort: 8080

        envFrom:
          - secretRef:
              name: infisical-app

        env:
          - name: SITE_URL
            value: https://app.infisical.ibrahimali.co.uk
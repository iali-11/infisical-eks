apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infisical-app
  annotations:
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: infisical-app
    creationPolicy: Owner
  data:
    - secretKey: encryption_key
      remoteRef:
        key: infisical/app
        property: ENCRYPTION_KEY
    - secretKey: auth_secret
      remoteRef:
        key: infisical/app
        property: AUTH_SECRET
    - secretKey: db_connection_uri
      remoteRef:
        key: infisical/app
        property: DB_CONNECTION_URI
    - secretKey: redis_url
      remoteRef:
        key: infisical/app
        property: REDIS_URL
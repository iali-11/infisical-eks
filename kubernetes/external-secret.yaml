apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infisical-app
  annotations:
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: infisical-app
    creationPolicy: Owner
  data:
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: infisical/app
        property: ENCRYPTION_KEY
    - secretKey: AUTH_SECRET
      remoteRef:
        key: infisical/app
        property: AUTH_SECRET
    - secretKey: DB_CONNECTION_URI
      remoteRef:
        key: infisical/app
        property: DB_CONNECTION_URI
    - secretKey: REDIS_URL
      remoteRef:
        key: infisical/app
        property: REDIS_URL